<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NOC — مراقبة الشبكة</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: radial-gradient(ellipse at top, #0d1428 0%, #070b16 70%);
    color: #e8ecf4; font-family: 'Segoe UI', Tahoma, sans-serif;
    height: 100vh; display: flex; flex-direction: column;
    padding: 14px 22px; overflow: hidden;
  }
  header { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  h1 { font-size: 1.5rem; color: #7dd3fc; text-shadow: 0 0 16px rgba(125,211,252,.3); }
  #clock { font-size: 1.15rem; color: #94a3b8; font-variant-numeric: tabular-nums; }
  button.fs { background: #1e2a44; color: #e8ecf4; border: 1px solid #2c3a5c; border-radius: 8px; padding: 6px 12px; cursor: pointer; font-size: .9rem; }
  button.fs:hover { background: #2c3a5c; }
  .counters { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
  .counter { flex: 1; min-width: 130px; background: linear-gradient(180deg,#111a2e,#0d1526); border: 1px solid #1e2a44; border-radius: 12px; padding: 10px 14px; text-align: center; }
  .counter .num { font-size: 2rem; font-weight: 800; line-height: 1.1; text-shadow: 0 0 12px currentColor; }
  .counter .lbl { font-size: .9rem; color: #94a3b8; }
  .num.ok { color: #22c55e; } .num.bad { color: #ef4444; } .num.warn { color: #f59e0b; } .num.info { color: #7dd3fc; }

  /* ── السلسلة: أعمدة أجيال من اليمين لليسار بخطوط ربط ── */
  #chain { flex: 1; display: flex; flex-direction: row; align-items: center; gap: 0; overflow: auto; padding: 6px 2px; }
  .level { display: flex; flex-direction: column; gap: 12px; justify-content: center; position: relative; padding-inline-end: 52px; min-width: 230px; }
  .level.spine::after {
    content: ''; position: absolute; inset-inline-end: 24px; top: 10%; bottom: 10%;
    width: 3px; border-radius: 2px;
    background: linear-gradient(180deg, #2c3a5c, #1e2a44);
  }
  .node {
    position: relative;
    background: linear-gradient(180deg,#111a2e,#0c1424); border: 1px solid #1e2a44;
    border-inline-start: 4px solid #64748b; border-radius: 12px; padding: 9px 13px;
    min-width: 205px;
  }
  .node.up { border-inline-start-color: #22c55e; box-shadow: 0 0 10px rgba(34,197,94,.22); }
  .node.down { border-inline-start-color: #ef4444; box-shadow: 0 0 14px rgba(239,68,68,.4); animation: pulse-red 1.6s ease-in-out infinite; }
  .node.pathdown { border-inline-start-color: #f59e0b; box-shadow: 0 0 10px rgba(245,158,11,.25); }
  .node.paused { opacity: .5; }
  @keyframes pulse-red { 0%,100% { box-shadow: 0 0 8px rgba(239,68,68,.3); } 50% { box-shadow: 0 0 18px rgba(239,68,68,.55); } }
  .node .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .node .nm { font-weight: 800; font-size: 1.02rem; }
  .node .meta { color: #94a3b8; font-size: .82rem; direction: ltr; text-align: left; }
  .node .st { font-weight: 800; font-size: .92rem; white-space: nowrap; }
  .st.up { color: #22c55e; } .st.down { color: #ef4444; } .st.pathdown { color: #f59e0b; } .st.paused { color: #94a3b8; }
  /* خط الربط الأفقي من كل بطاقة نحو عمود الجيل التالي (يسارًا في RTL) — ملون بحالة الجهاز */
  .level:not(:last-child) .node::before {
    content: ''; position: absolute; inset-inline-end: -30px; top: 50%;
    width: 30px; height: 3px; border-radius: 2px; background: #2c3a5c;
  }
  .level:not(:last-child) .node.up::before { background: #22c55e; box-shadow: 0 0 6px rgba(34,197,94,.5); }
  .level:not(:last-child) .node.down::before { background: #ef4444; box-shadow: 0 0 6px rgba(239,68,68,.5); }
  .level:not(:last-child) .node.pathdown::before { background: #f59e0b; }
  .node.leaf::before { display: none; }
  #updated { margin-top: 8px; color: #475569; font-size: .8rem; text-align: center; }
</style>
</head>
<body>
  <header>
    <h1>🖥️ مراقبة الشبكة — NOC</h1>
    <div style="display:flex; gap:10px; align-items:center;">
      <span id="clock">—</span>
      <button class="fs" onclick="document.documentElement.requestFullscreen && document.documentElement.requestFullscreen()">⛶ ملء الشاشة</button>
    </div>
  </header>

  <div class="counters">
    <div class="counter"><div class="num ok" id="c-up">—</div><div class="lbl">متصل</div></div>
    <div class="counter"><div class="num bad" id="c-down">—</div><div class="lbl">منقطع</div></div>
    <div class="counter"><div class="num warn" id="c-path">—</div><div class="lbl">مسدود عبر المسار</div></div>
    <div class="counter"><div class="num info" id="c-total">—</div><div class="lbl">إجمالي الأجهزة</div></div>
  </div>

  <div id="chain"><p style="color:#475569">جاري التحميل…</p></div>
  <div id="updated">—</div>

<script>
(function () {
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
    }[c]));
  }

  // ترتيب رقمي طبيعي: الرقم في آخر الاسم (Device-104 → 104).
  function natKey(n) {
    const m = String(n.name || '').match(/(\d+)\s*$/);
    if (m) return parseInt(m[1], 10);
    const ipm = String(n.ip || '').match(/(\d+)\s*$/);
    return ipm ? parseInt(ipm[1], 10) : 999999;
  }
  function statusWeight(n) {
    if (n.status === 'offline') return 0;
    if (n.pathDown) return 1;
    if (n.status === 'paused') return 3;
    return 2;
  }
  function sortLevel(nodes) {
    nodes.sort((a, b) => {
      const w = statusWeight(a) - statusWeight(b);
      if (w !== 0) return w;
      return natKey(a) - natKey(b);
    });
    nodes.forEach((n) => { if (n.children && n.children.length) sortLevel(n.children); });
  }

  function nodeHtml(n, depth) {
    const paused = n.status === 'paused';
    const down = n.status === 'offline';
    const pathDown = !!n.pathDown;
    const cls = paused ? 'node paused' : down ? 'node down' : pathDown ? 'node pathdown' : 'node up';
    const st = paused ? '⏸ موقوف' : down ? '🔴 منقطع' : pathDown ? '⛔ مسدود عبر المسار' : '🟢 متصل';
    const stCls = paused ? 'st paused' : down ? 'st down' : pathDown ? 'st pathdown' : 'st up';
    const leaf = !(n.children && n.children.length) ? ' leaf' : '';
    const kids = (n.children && n.children.length)
      ? '<div class="children">' + n.children.map((c) => nodeHtml(c, depth + 1)).join('') + '</div>'
      : '';
    return '<div class="' + cls + leaf + '">'
      + '<div class="row">'
      + '<span class="nm">' + esc(n.name) + '</span>'
      + '<span class="st ' + stCls + '">' + st + '</span>'
      + '</div>'
      + '<div class="meta"><span class="ip">' + esc(n.ip) + '</span>'
      + (n.device_type_name ? ' — <span class="tp">' + esc(n.device_type_name) + '</span>' : '')
      + '</div>'
      + '</div>'
      + kids;
  }

  function markPathDown(nodes, parentDown) {
    for (const n of nodes) {
      const pd = parentDown || n.status === 'offline';
      n.pathDown = !!(pd && n.status !== 'offline' && n.status !== 'paused');
      if (n.children && n.children.length) markPathDown(n.children, pd);
    }
  }

  function render(data) {
    markPathDown(data, false);
    sortLevel(data);
    // بناء أعمدة الأجيال من الشجرة (المستوى 0 = الجذور، ثم الأبناء...).
    const levels = [];
    (function collect(nodes, depth) {
      if (!levels[depth]) levels[depth] = [];
      for (const n of nodes) { levels[depth].push(n); collect(n.children || [], depth + 1); }
    })(data, 0);
    const chainEl = document.getElementById('chain');
    chainEl.innerHTML = '<div class="chain">'
      + levels.map((lvl, idx) => {
          const spine = idx < levels.length - 1 ? ' spine' : '';
          return '<div class="level' + spine + '">' + lvl.map((n) => nodeHtml(n, 0)).join('') + '</div>';
        }).join('')
      + '</div>';
    const flat = [];
    (function count(nodes) { for (const n of nodes) { flat.push(n); count(n.children || []); } })(data);
    const up = flat.filter((n) => n.status === 'online').length;
    const down = flat.filter((n) => n.status === 'offline').length;
    const path = flat.filter((n) => n.pathDown).length;
    document.getElementById('c-up').textContent = up;
    document.getElementById('c-down').textContent = down;
    document.getElementById('c-path').textContent = path;
    document.getElementById('c-total').textContent = flat.length;
    document.getElementById('updated').textContent =
      'آخر تحديث: ' + new Date().toLocaleTimeString('ar-EG') + ' — يتحدث تلقائياً كل 10 ثوانٍ';
  }

  async function tick() {
    try {
      const r = await fetch('/api/topology', { credentials: 'same-origin' });
      const j = await r.json();
      if (j.success && Array.isArray(j.data)) render(j.data);
    } catch (e) { /* تعيد المحاولة في الدورة التالية */ }
  }

  function clock() {
    const d = new Date();
    document.getElementById('clock').textContent =
      d.toLocaleDateString('ar-EG') + ' — ' + d.toLocaleTimeString('ar-EG');
  }

  clock();
  setInterval(clock, 1000);
  tick();
  setInterval(tick, 10000);
})();
</script>
</body>
</html>
