# =========================================================
# nginx — خريطة Connection للواجهة العكسية (reverse proxy)
# ---------------------------------------------------------
# الغرض: تحويل قيمة الـ Connection header تلقائيًا وفقًا لطلب Upgrade:
#   - WebSocket (Upgrade: websocket)  → upgrade
#   - أي طلب آخر (SSE/HTTP العادي)     → ""  (keep-alive افتراضي)
#
# ⚠️ ملاحظة سياق nginx: هذه الكتلة `map` تُقبل فقط داخل `http { }`،
#    وليس داخل `server { }` أو `location { }`. ضَع هذا الملف بإحدى طريقتين:
#       a) انسخه إلى: /etc/nginx/conf.d/connection-map.conf
#          (يُضمَّن تلقائيًا داخل http{} عبر nginx.conf الافتراضي)
#       b) أو الصق محتواه في أعلى /etc/nginx/nginx.conf داخل كتلة http{}.
#
# إعادة التحميل بعد النسخ:
#    sudo nginx -t && sudo systemctl reload nginx
# =========================================================

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}
