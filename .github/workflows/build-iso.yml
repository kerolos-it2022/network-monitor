# build-iso.yml — بناء صورة appliance ISO تلقائيًّا.
# التشغيل: يدويًّا (workflow_dispatch) أو تلقائيًّا مع كل tag يبدأ بـ v.
# الناتج: artifact اسمه appliance-iso + مرفق بـ Release لو كان الTrigger tag.
name: Build Appliance ISO

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-iso:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # التاريخ مطلوب لِـ git describe (اسم الإصدار في اسم الـ ISO).
          fetch-depth: 0

      # live-build على أوبونتو مكسور مع دبيان bookworm (روابط security قديمة،
      # مسارات firmware 404) — لذا نبني داخل حاوية debian:bookworm الحقيقية،
      # وبـ --privileged لِـ أن live-build يحتاج chroot/mount.
      - name: Build ISO (inside debian:bookworm)
        env:
          NM_VERSION: ${{ github.sha }}
        run: |
          docker run --rm --privileged \
            -v "$GITHUB_WORKSPACE":/workspace \
            -w /workspace/appliance \
            -e NM_VERSION \
            debian:bookworm bash build.sh
          ls -lh appliance/*.iso

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: appliance-iso
          path: appliance/*.iso
          if-no-files-found: error
          retention-days: 30

      - name: Attach to release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: appliance/*.iso
          generate_release_notes: true
