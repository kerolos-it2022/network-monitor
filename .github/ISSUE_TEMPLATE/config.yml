# Issue template configuration
# ===========================
# Blank issues are disabled so reports arrive with the details needed to diagnose them
# (bug_report / feature_request).
blank_issues_enabled: false

contact_links:
  - name: 💬 General question or discussion
    url: https://github.com/kerolos-it2022/network-monitor/discussions
    about: |
      For general questions, usage, discussions and ideas before they become a feature request.
      Please use GitHub Discussions instead of opening an issue.
      (للأسئلة العامة والنقاشات استخدم Discussions.)

  - name: 🔒 Report a security vulnerability
    url: https://github.com/kerolos-it2022/network-monitor/security/advisories/new
    about: |
      ⚠️ Never open a public issue for a security problem.
      Use GitHub Security Advisories (private and safe) — see SECURITY.md.

  - name: 📚 Documentation
    url: https://github.com/kerolos-it2022/network-monitor#readme
    about: Check the docs first — the answer may already be in README.md, docs/DEPLOY.md, docs/ARCHITECTURE.md or docs/I18N.md.
