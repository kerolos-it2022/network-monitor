# =========================================================
# nginx network-monitor — Reverse Proxy (server block فقط)
# ---------------------------------------------------------
# هذا الملف يَحوي كِتلة `server { }` فقط — يُنسخ مباشرةً إلى:
#   /etc/nginx/sites-available/network-monitor
#   sudo ln -s /etc/nginx/sites-available/network-monitor /etc/nginx/sites-enabled/
#
# ⚠️ تَعتمد هذه الكتلة على المتغيِّر `$connection_upgrade` الذي يُوفِّره ملف
#    `nginx.connection-map.conf`. انسخ ذاك الملف أيضًا إلى:
#   /etc/nginx/conf.d/connection-map.conf
# (دون `map`، `nginx -t` سيَفشل بِـ "unknown variable $connection_upgrade").
#
# الاختبار/الإعادة:
#   sudo nginx -t && sudo systemctl reload nginx
# =========================================================

server {
    listen 80;
    server_name monitor.yourcompany.com;  # عدّله لدومين شركتك أو IP السيرفر أو دومين ngrok

    # لو أردت HTTPS لاحقاً، استخدم certbot:
    #   sudo certbot --nginx -d monitor.yourcompany.com

    client_max_body_size 10m;

    # ===== مسار SSE لمسح الأجهزة (يعمل فقط عبر reverse proxy) =====
    # إعداد ضروري: يَعطّل الـ buffering ويُبقي Connection عاديًّا (لا upgrade) ويزيد المهلة.
    # بدون هذا، يقوم Nginx بتخزين الأحداث الصغيرة (خطوط تقدم المسح + heartbeat) في buffer،
    # ولا يصل شيء للمتصفح حتى يمتلئ buffer، فيُحدِّث EventSource خطأ "انقطع الاتصال بالخادم".
    location /api/scan/stream/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # تعطيل الـ buffering — ضروري لـ Server-Sent Events
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;

        # مهلة طويلة (المسح قد يأخذ دقائق؛ الـ heartbeat كل 15ث يُبقي الاتصال)
        proxy_read_timeout 3600;
        proxy_send_timeout 3600;
    }

    # ===== باقي المسارات (API + frontend + WebSocket مستقبلي) =====
    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # دعم WebSocket مستقبلي (المتصفح يُعلن Upgrade، وإلا Connection عادي)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 86400;
    }
}
