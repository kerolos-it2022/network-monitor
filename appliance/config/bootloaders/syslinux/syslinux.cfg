# BIOS boot menu (syslinux) — Network Monitor Appliance, no Debian branding.
DEFAULT nm
PROMPT 0
TIMEOUT 50

LABEL nm
    MENU LABEL Network Monitor Appliance — ^Boot / Install
    KERNEL /live/vmlinuz
    INITRD /live/initrd.img
    APPEND boot=live components nomodeset

LABEL verbose
    MENU LABEL Network Monitor Appliance — ^Diagnostic mode
    KERNEL /live/vmlinuz
    INITRD /live/initrd.img
    APPEND boot=live components nomodeset verbose
