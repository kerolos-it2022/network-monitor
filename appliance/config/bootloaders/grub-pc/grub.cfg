# قائمة إقلاع Network Monitor Appliance — بلا أي إشارة لديبيان.
# bootappend مطابق لِـ auto/config (boot=live components nomodeset).
set default="0"
set timeout=5
set timeout_style=menu

menuentry "Network Monitor Appliance — تَشغيل / تثبيت" {
    linux /live/vmlinuz boot=live components nomodeset
    initrd /live/initrd.img
}

menuentry "Network Monitor Appliance — وضع تَشخيص (إظهار رسائل الإقلاع كاملة)" {
    linux /live/vmlinuz boot=live components nomodeset verbose
    initrd /live/initrd.img
}
