# Direct boot — no visible menu (appliance style).
# For the diagnostic menu: press ESC during the first two seconds.
set default="0"
set timeout=2
set timeout_style=hidden

menuentry "Network Monitor Appliance — Boot / Install" {
    linux /live/vmlinuz boot=live components nomodeset
    initrd /live/initrd.img
}

menuentry "Network Monitor Appliance — Diagnostic mode (full boot messages)" {
    linux /live/vmlinuz boot=live components nomodeset verbose
    initrd /live/initrd.img
}
