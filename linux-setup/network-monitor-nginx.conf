# =========================================================
# nginx — Network Monitor Reverse Proxy (server block فقط)
# ---------------------------------------------------------
# هذا الملف يَحوي كِتلة `server { }` فقط — يُنسخ مباشرةً إلى:
#   /etc/nginx/sites-available/network-monitor
#   sudo ln -s /etc/nginx/sites-available/network-monitor /etc/nginx/sites-enabled/
#
# ⚠️ يَعتمد هذا الملف على المتغيِّر `$connection_upgrade` الذي يُوفِّره ملف
#    `nginx.connection-map.conf` الموجود في جذر المستودع. انسخه إلى:
#   /etc/nginx/conf.d/connection-map.conf
# (دون `map`، `nginx -t` سيَفشل بِـ "unknown variable $connection_upgrade").
#
# الاختبار/الإعادة:
#   sudo nginx -t && sudo systemctl reload nginx
# =========================================================

# إعادة توجيه HTTP إلى HTTPS (اختياري - فعّله بعد تثبيت الشهادة)
# server {
#     listen 80;
#     server_name _;
#     return 301 https://$host$request_uri;
# }

server {
    listen 80;
    # عدّل هذا لأي IP أو دومين تريده
    server_name _;

    client_max_body_size 10m;

    # سجلات الوصول والأخطاء
    access_log /var/log/nginx/network-monitor-access.log;
    error_log  /var/log/nginx/network-monitor-error.log;

    # ===== مسار SSE لمسح الأجهزة (إعداد ضروري عبر reverse proxy) =====
    # تعطيل الـ buffering + مهلة طويلة: بدون هذا يخزن Nginx أحداث المسح الصغيرة في buffer،
    # فيظهر للمتصفح خطأ "انقطع الاتصال بالخادم" رغم عمل المسح بشكل صحيح.
    location /api/scan/stream/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;

        proxy_read_timeout 3600;
        proxy_send_timeout 3600;
    }

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # دعم WebSocket مستقبلي و sessions عادية
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 86400;
    }
}
