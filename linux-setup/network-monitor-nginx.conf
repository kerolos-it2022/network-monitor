# =========================================================
# nginx — Network Monitor Reverse Proxy
# الملف: /etc/nginx/sites-available/network-monitor
# تفعيل: sudo ln -s /etc/nginx/sites-available/network-monitor /etc/nginx/sites-enabled/
# اختبار: sudo nginx -t
# إعادة: sudo systemctl reload nginx
# =========================================================

# خريطة لإرسال Connection الصحيح حسب الطلب (WebSocket upgrade vs HTTP/SSE العادي).
# ضعها داخل http { } (nginx.conf أو ملف conf.d). لا تُقبل داخل server { }.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

# إعادة توجيه HTTP إلى HTTPS (اختياري - فعّله بعد تثبيت الشهادة)
# server {
#     listen 80;
#     server_name _;
#     return 301 https://$host$request_uri;
# }

server {
    listen 80;
    # عدّل هذا لأي IP أو دومين تريده
    server_name _;

    client_max_body_size 10m;

    # سجلات الوصول والأخطاء
    access_log /var/log/nginx/network-monitor-access.log;
    error_log  /var/log/nginx/network-monitor-error.log;

    # ===== مسار SSE لمسح الأجهزة (إعداد ضروري عبر reverse proxy) =====
    # تعطيل الـ buffering + مهلة طويلة: بدون هذا يخزن Nginx أحداث المسح الصغيرة في buffer،
    # فيظهر للمتصفح خطأ "انقطع الاتصال بالخادم" رغم عمل المسح بشكل صحيح.
    location /api/scan/stream/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;

        proxy_read_timeout 3600;
        proxy_send_timeout 3600;
    }

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # دعم WebSocket مستقبلي و sessions عادية
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 86400;
    }
}